phase: A

# Giai đoạn A (MVP) — THỊ TRƯỜNG MỸ, dùng chung 8 mã với Giai đoạn 0.
data:
  market: "US"
  source: "yfinance"
  tickers: ["AAPL", "MSFT", "JPM", "JNJ", "XOM", "PG", "KO", "NVDA"]
  start_date: "2015-01-01"
  end_date: "2025-12-31"
  raw_ohlcv_path: "data/raw/ohlcv/phase_0.parquet"
  processed_path: "data/processed/phase_0.parquet"
  walk_forward:
    train_range: ["2019-01-01", "2022-12-31"]
    val_range: ["2023-01-01", "2023-06-30"]
    test_range: ["2023-07-01", "2023-12-31"]

env:
  initial_cash: 1_000_000        # USD
  transaction_cost: 0.0005       # 0.05%/lệnh (broker Mỹ)
  price_limit: null              # Mỹ không có biên độ giá
  max_weight: 0.30               # trần 30%/mã (De-Cuong §6.2)
  reward:
    alpha: 0.5   # trọng số net_return — PLACEHOLDER, phải grid-search trên tập val
    beta: 0.3    # trọng số sharpe_local
    gamma: 0.2   # trọng số drawdown penalty
    window: 20

model:
  base_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  # float32 cho PPO ổn định: bf16 làm Dirichlet.log_prob lệch giữa pha collect
  # và update -> approx_kl/clip_frac nổ ngay update đầu (xem ppo_trainer.update).
  # Qwen-1.5B + LoRA fp32 ~7GB VRAM, GPU >= 10GB chạy thoải mái (RTX 5060 Ti 16GB OK).
  torch_dtype: "float32"
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  max_prompt_length: 512

training:
  n_steps: 512
  n_epochs: 2
  batch_size: 64
  lr: 3.0e-6                            # giảm từ 1e-5: reward đã scale x100 nên gradient lớn hơn, cần lr nhỏ hơn
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  total_updates: 200
  seeds: [0, 1, 2, 3, 4]
  gradient_checkpointing: true
  save_every: 10   # lưu checkpoint resume mỗi 10 update (~13 phút) — chống mất tiến độ khi Colab ngắt
  # --- Ổn định PPO (fix approx_kl/clip_frac cao) ---
  dirichlet_concentration_scale: 20.0  # vùng entropy ổn định nhất (đo thực nghiệm); kết hợp uniform smoothing trong _weights_to_dirichlet
  entropy_coef: 0.01                   # hệ số entropy bonus (khuyến khích exploration)
  target_kl: 0.05                      # KL early-stop: dừng epoch khi policy trôi quá xa (null = tắt)

baselines:
  b4_ppo_no_llm:
    total_timesteps: 200_000

logging:
  wandb_project: "hifa-phase-a"
  tensorboard_dir: "./logs"

evaluation:
  n_seeds: 5
  output_dir: "reports/phase_a"
