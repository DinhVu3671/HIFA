phase: A

# ===========================================================================
# BIẾN THỂ NHẮM HỘI TỤ của phase_a_fast.yaml — sửa nguyên nhân A1 KHÔNG hội tụ
# quan sát được trên 3 seed thực (reward phẳng ~0.66-0.82, approx_kl 0.08-0.18
# VƯỢT target_kl=0.05 ở MỌI update -> early-stop cắt epoch liên tục -> policy
# không cập nhật đủ).
#
# BA THAY ĐỔI (so với phase_a_fast.yaml), đều có căn cứ thực nghiệm:
#   1. target_kl 0.05 -> 0.15
#      Lý do: approx_kl đo thực tế mỗi update = 0.08-0.18 (bản chất phân phối
#      Dirichlet nhiều chiều), luôn vượt 0.05 -> KL early-stop kích hoạt gần
#      như mọi update, policy chỉ chạy ~1 epoch rồi dừng. Nới lên 0.15 cho đa
#      số update chạy trọn, vẫn phanh khi KL vọt bất thường (>0.15).
#      Căn cứ: log approx_kl của seed 0/1/2 (vòng train 2026-10-24).
#   2. n_epochs 1 -> 3
#      Lý do: fast đặt =1 để nhanh; cộng early-stop chặt -> mỗi rollout gần như
#      chỉ quét 1 lần -> học quá ít. PPO chuẩn dùng 3-10 epoch/rollout.
#   3. lr 3e-6 -> 1e-5 (giá trị gốc trước khi bị hạ)
#      Lý do: khi KL không còn chặn (sau sửa 1), lr 3e-6 quá nhỏ -> cập nhật
#      chậm -> reward phẳng. Advantage đã được normalize trong update() nên lr
#      1e-5 an toàn. Căn cứ: comment gốc "giảm từ 1e-5" trong phase_a.yaml.
#
# ⚠️ BẮT BUỘC PROBE TRƯỚC KHI TRAIN ĐỦ: chạy 1 seed ~15 update (n_steps giữ 512,
# tạm total_updates=15) và kiểm tra:
#   - approx_kl phần lớn < 0.15 (không còn early-stop mọi update)
#   - reward BẮT ĐẦU nhích lên qua 15 update (không phẳng)
# Nếu đạt -> train đủ 3-5 seed. Nếu reward vẫn phẳng -> vòng tune tiếp:
#   (a) grid-search reward alpha/beta/gamma (env._compute_reward) trên validation,
#   (b) hoặc giảm dirichlet_concentration_scale 12 -> 8 (phân phối bớt nhọn,
#       exploration nhiều hơn). KHÔNG đổi nhiều biến cùng lúc — đổi 1, probe, đọc.
# ===========================================================================

data:
  market: "US"
  source: "yfinance"
  tickers: ["AAPL", "MSFT", "JPM", "JNJ", "XOM", "PG", "KO", "NVDA"]
  start_date: "2015-01-01"
  end_date: "2025-12-31"
  raw_ohlcv_path: "data/raw/ohlcv/phase_0.parquet"
  processed_path: "data/processed/phase_0.parquet"
  walk_forward:
    train_range: ["2019-01-01", "2022-12-31"]
    val_range: ["2023-01-01", "2023-06-30"]
    test_range: ["2023-07-01", "2023-12-31"]

env:
  initial_cash: 1_000_000
  transaction_cost: 0.0005
  price_limit: null
  max_weight: 0.30
  reward:
    alpha: 0.5     # trọng số net_return — PLACEHOLDER, grid-search trên validation nếu probe chưa đạt
    beta: 0.3      # trọng số sharpe_local
    gamma: 0.2     # trọng số differential-drawdown penalty
    window: 20

model:
  base_model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  torch_dtype: "bfloat16"        # bf16 nhanh ~1.5-2x; KL nổ cũ do bug padding (đã fix), không phải dtype
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  max_prompt_length: 256

training:
  n_steps: 512
  n_epochs: 3                    # SỬA 2: 1 -> 3 (dùng kỹ mỗi rollout; PPO chuẩn 3-10 epoch)
  batch_size: 32                 # giữ 32 (tránh OOM 16GB)
  lr: 1.0e-5                     # SỬA 3: 3e-6 -> 1e-5 (cập nhật đủ nhanh khi KL không còn chặn)
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  total_updates: 200
  seeds: [0, 1, 2, 3, 4]
  gradient_checkpointing: true   # giữ bật (tránh OOM 16GB)
  save_every: 10
  dirichlet_concentration_scale: 12.0  # giữ 12 (đã probe ổn định); dự phòng hạ xuống 8 nếu reward vẫn phẳng
  entropy_coef: 0.01
  target_kl: 0.15                # SỬA 1: 0.05 -> 0.15 (khớp mức KL thực tế của Dirichlet, hết early-stop liên tục)

baselines:
  b4_ppo_no_llm:
    total_timesteps: 200_000

logging:
  wandb_project: "hifa-phase-a"
  tensorboard_dir: "./logs"

evaluation:
  n_seeds: 5
  output_dir: "reports/phase_a"
